[pytest]
testpaths = tests
pythonpath = .
addopts = --strict-markers -ra
timeout = 120
markers =
    unit: helpers puros, sem rede (offline)
    integration: camada services/ contra o Supabase real
    e2e: fluxo completo via navegador (Playwright) contra o app in-process
    vertex: chamada real ao Vertex AI / Gemini (consome cota)
