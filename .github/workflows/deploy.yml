name: Sync to Hugging Face hub
on:
  push:
    branches: [develop]

  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push TCC-Cognitive-Load/ subfolder as the Space root
        env:
          HF_TOKEN: ${{ secrets.HF_ACTIONTOKEN }}
        run: |
          cd TCC-Cognitive-Load
          git init -b deploy
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" \
            commit -m "Deploy ${{ github.sha }}"
          git push --force \
            https://bernardodavila:$HF_TOKEN@huggingface.co/spaces/bernardodavila/tcc-cognitive-load \
            deploy:main
